<meta name="apple-mobile-web-app-title" content="モグラ叩き">
<meta name="theme-color" content="#7cc96b">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#bfe6ff; --grass:#7cc96b; --grass-dark:#5aa94b;
    --soil:#6b4226; --hole:#2e1b10;
    --ink:#2b2b2b; --accent:#ff7a3d; --gold:#ffcf3d; --red:#e5484d; --blue:#3d7bff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(var(--sky) 0 210px, var(--grass) 210px 100%);
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
    display:flex;flex-direction:column;align-items:center;transition:background .4s;
  }
  body.rush{background:linear-gradient(#ffb38a 0 210px, #e9a04a 210px 100%)}
  body.rush .hole .front{background:#c9822f}
  .wrap{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:12px 14px 18px}

  /* HUD */
  .hud{display:flex;gap:8px;align-items:stretch}
  .stat{flex:1;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.12);text-align:center}
  .stat small{display:block;font-size:11px;opacity:.6;font-weight:500}
  .stat b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .timebar{height:10px;background:rgba(255,255,255,.6);border-radius:99px;margin:10px 0 8px;overflow:hidden}
  .timebar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px;transition:width .1s linear}
  .timebar i.hurry{background:var(--red)}

  /* Mission */
  .mission{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 3px 0 rgba(0,0,0,.12);min-height:58px;position:relative;overflow:hidden}
  .mtop{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
  .mlabel{background:var(--blue);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;letter-spacing:.05em;flex:none}
  #mText{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mProg{font-variant-numeric:tabular-nums;color:var(--blue)}
  .mbar{height:6px;background:#e8eefc;border-radius:99px;margin-top:7px;overflow:hidden}
  .mbar i{display:block;height:100%;width:100%;background:var(--blue);border-radius:99px}
  .mission.idle #mText{color:#999;font-weight:500}
  .mission.idle .mlabel{background:#bbb}
  .mission.clear{animation:flash .5s}
  .mission.fail{animation:shake .35s}
  @keyframes flash{30%{background:#fff3b0}}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .rushinfo{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;margin:6px 2px 0;height:20px}
  .pips{display:flex;gap:4px}
  .pips span{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.7);border:2px solid #fff}
  .pips span.on{background:var(--red)}
  .combo{color:var(--accent)}

  /* Field */
  .field{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,auto);gap:12px 12px;align-content:center;padding-top:4px}
  .hole{position:relative;aspect-ratio:1/1.05;width:100%;overflow:hidden;border-radius:0 0 46% 46%;touch-action:none}
  .hole::after{
    content:"";position:absolute;left:4%;right:4%;bottom:4%;height:30%;
    background:var(--hole);border-radius:50%;
    box-shadow:0 6px 0 var(--soil), inset 0 6px 10px rgba(0,0,0,.5);z-index:0}
  .mole{position:absolute;left:16%;width:68%;height:78%;bottom:-80%;z-index:1;transition:bottom .12s ease-out;pointer-events:none}
  .hole .front{position:absolute;left:0;right:0;bottom:0;height:19%;z-index:2;background:var(--grass-dark);border-radius:0 0 46% 46%/0 0 100% 100%;transition:background .4s}
  .mole.wide{left:4%;width:92%}
  .hole.up .mole{bottom:6%}
  .hole.hit .mole{bottom:-10%;transition:bottom .18s ease-in}
  .hole.hit .mole svg{animation:squash .18s}
  .hole.bonk .mole svg{animation:bonk .15s}
  @keyframes squash{50%{transform:scale(1.15,.8)}}
  @keyframes bonk{50%{transform:translateY(8%) scale(1.05,.92)}}

  .pop{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-weight:800;font-size:22px;white-space:nowrap;
       z-index:5;pointer-events:none;animation:pop .6s forwards;text-shadow:0 2px 0 #fff}
  .pop.small{font-size:16px}
  @keyframes pop{to{transform:translate(-50%,-40px);opacity:0}}

  /* 画面中央のお知らせ */
  .banner{position:fixed;left:0;right:0;top:42%;text-align:center;z-index:8;pointer-events:none;
          font-weight:800;font-size:34px;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25), 0 0 18px rgba(0,0,0,.2);
          animation:banner 1.3s forwards}
  .banner small{display:block;font-size:18px}
  @keyframes banner{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}

  /* Overlay */
  .overlay{position:fixed;inset:0;background:rgba(30,40,30,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
  [hidden]{display:none !important}
  .card{background:#fff;border-radius:22px;padding:22px 20px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.15);max-height:100%;overflow:auto}
  .card h1{margin:0 0 4px;font-size:28px;font-weight:800}
  .card p{margin:6px 0;font-size:14px;line-height:1.6}
  .rules{text-align:left;background:#f6f3ee;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:13px;line-height:1.8}
  .big{font-size:52px;font-weight:800;color:var(--accent);line-height:1;margin:6px 0}
  .rank{display:inline-block;background:var(--ink);color:var(--gold);font-weight:800;font-size:20px;padding:6px 16px;border-radius:99px;margin:4px 0}
  .rank-next{font-size:12px;opacity:.7}
  .btn{appearance:none;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:800;font-size:20px;
       padding:14px 0;width:100%;border-radius:16px;box-shadow:0 5px 0 #c9541f;margin-top:10px}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c9541f}
  .count{font-size:110px;font-weight:800;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.25)}
  .grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0;font-size:12px}
  .grid2 div{background:#f6f3ee;border-radius:10px;padding:6px 2px}
  .grid2 b{display:block;font-size:19px}
  .new{color:var(--red);font-weight:800}

  /* ランキング（仕様13.4） */
  .btns{display:flex;gap:8px;margin-top:10px}
  .btns .btn{margin-top:0;flex:1}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--blue);box-shadow:none;font-size:17px}
  .btn.ghost:active{transform:translateY(2px)}
  .gline{display:flex;justify-content:center;gap:16px;align-items:baseline;font-size:13px;margin:8px 0 2px}
  .gline b{font-size:20px;font-weight:800;margin-left:2px;font-variant-numeric:tabular-nums}
  .netmsg{font-size:12px;color:#777;line-height:1.5;margin:2px 0 4px;min-height:1.5em}
  .rk-h{font-size:24px}
  .namebox{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;font-size:13px;font-weight:800}
  .namebox input{width:calc(11em + 24px);font:inherit;font-size:16px;font-weight:800;padding:8px 10px;border:2px solid #e3ddd3;border-radius:10px;
                 background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
  .namebox input:focus{outline:none;border-color:var(--accent)}
  .rk-table{width:100%;border-collapse:collapse;font-size:14px;text-align:left;margin:4px 0}
  .rk-table td{padding:6px 6px}
  .rk-table tr:nth-child(odd) td{background:#f4f2ee}
  .rk-table td.pos{width:2.6em;text-align:center;font-weight:800}
  .rk-table td.nm{word-break:break-all}
  .rk-table td.sc{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .rk-table tr.me td{background:rgba(255,122,61,.18);font-weight:800}
  .rk-table tr.gap td{background:none;text-align:center;color:#999;padding:2px}
  .rk-empty{color:#999;padding:24px 0;font-size:14px}
  .rk-wrap{margin:0 -4px;padding:0 4px}  /* 収まらないときはカード全体がスクロール */
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="stat"><small>スコア</small><b id="score">0</b></div>
    <div class="stat"><small>のこり</small><b id="time">60</b></div>
    <div class="stat"><small>ベスト</small><b id="best">0</b></div>
  </div>
  <div class="timebar"><i id="bar"></i></div>

  <div class="mission idle" id="mission">
    <div class="mtop"><span class="mlabel">MISSION</span><span id="mText">まもなく開始…</span><span id="mProg"></span></div>
    <div class="mbar"><i id="mBar" style="width:0"></i></div>
  </div>
  <div class="rushinfo">
    <span id="rushText">ラストラッシュまで</span>
    <span class="pips" id="pips"></span>
    <span class="combo" id="combo"></span>
  </div>

  <div class="field" id="field"></div>
</div>

<!-- スタート画面 -->
<div class="overlay" id="startScreen">
  <div class="card">
    <h1>モグラ叩き</h1>
    <p>60秒でどれだけ叩ける？</p>
    <div class="rules" id="rules"></div>
    <div class="btns">
      <button class="btn" id="startBtn">スタート</button>
      <button class="btn ghost" id="rankBtn1">🏆 ランキング</button>
    </div>
  </div>
</div>

<!-- カウントダウン -->
<div class="overlay" id="countScreen" hidden><div class="count" id="countNum">3</div></div>

<!-- 結果画面 -->
<div class="overlay" id="resultScreen" hidden>
  <div class="card">
    <h1 id="resTitle">タイムアップ！</h1>
    <div class="big" id="resScore">0</div>
    <div class="rank" id="resRank"></div>
    <div class="rank-next" id="resNext"></div>
    <div class="grid2">
      <div>ヒット<b id="resHit">0</b></div>
      <div>命中率<b id="resAcc">0%</b></div>
      <div>最大コンボ<b id="resCombo">0</b></div>
      <div>ミッション<b id="resMission">0</b></div>
      <div>ラッシュ<b id="resRush">-</b></div>
      <div>ボム<b id="resBomb">0</b></div>
    </div>
    <div class="gline"><span>自己ベスト<b id="resBest">0</b></span><span id="resWorldWrap" hidden>全体<b id="resWorld">-</b>位</span></div>
    <div class="netmsg" id="resNet"></div>
    <div class="btns">
      <button class="btn" id="retryBtn">もう一回</button>
      <button class="btn ghost" id="rankBtn2">🏆 ランキング</button>
    </div>
  </div>
</div>

<!-- ランキング（タイトル／結果のカードと切り替えて表示） -->
<div class="overlay" id="rankScreen" hidden>
  <div class="card">
    <h1 class="rk-h">🏆 ランキング</h1>
    <div class="gline"><span>自己ベスト<b id="rkBest">0</b></span><span id="rkWorldWrap" hidden>全体<b id="rkWorld">-</b>位</span></div>
    <label class="namebox">ニックネーム
      <input id="nameInput" maxlength="12" autocomplete="nickname" enterkeyhint="done" spellcheck="false">
    </label>
    <div class="rk-wrap" id="rkBody"></div>
    <div class="netmsg" id="rkNet"></div>
    <button class="btn" id="rankClose">とじる</button>
  </div>
</div>

<script>
(() => {
  // ================= 設定（ここを変えればバランス調整できます） =================
  const CONFIG = {
    duration: 60,                 // プレイ時間（秒）
    holes: 9,
    // 出現間隔・表示時間・同時出現数は「開始時 → 終了時」で変化
    spawnInterval: [900, 420],    // ms
    upTime:        [1150, 650],   // ms
    maxActive:     [1, 3],
    rates: { gold: 0.07, bomb: 0.12, trio: 0.13 },  // 残りは普通のモグラ
    trioHp: 3,                    // 3兄弟モグラを倒すのに必要な回数（＝兄弟の数）
    trioUpTimeScale: 2.0,         // 3兄弟は長めに出ている
    points: { normal: 10, gold: 50, trio: [10, 20, 30], bomb: -30 },   // 3兄弟は1回目・2回目・3回目の点数（コンボ倍率はかけない）
    comboStep: 5,                 // 5コンボごとに倍率+1
    comboMaxMult: 3,              // 倍率の上限

    // ミッション
    missionFirstDelay: 3,         // 開始から最初のミッションまで（秒）
    missionGap: 1.5,              // ミッション同士の間隔（秒）

    // ラストラッシュ
    rushNeed: 4,                 // 必要なミッションクリア数
    rushSeconds: 10,              // 残り何秒から始まるか
    rush: { spawnInterval: 230, upTime: 700, maxActive: 5, scoreScale: 1.5,
            rates: { gold: 0.15, bomb: 0.10, trio: 0.05 } },

    // ランク称号（score 以上でその称号）
    ranks: [
      { score: 0,    name: 'モグラの友だち' },
      { score: 500,  name: '見習いハンマー' },
      { score: 1000, name: '駆け出しハンター' },
      { score: 1600, name: '一人前ハンター' },
      { score: 2400, name: '腕利きハンター' },
      { score: 3300, name: 'モグラ名人' },
      { score: 4300, name: 'モグラ達人' },
      { score: 5500, name: '伝説のハンマー' },
    ],
  };

  // ミッション一覧：target 回で達成、limit 秒以内、reward 点
  //   force: そのミッション中に必ず出すモグラ
  //   on(e, m): イベントごとに進捗を更新。'fail' を返すと即失敗
  const MISSIONS = [
    { id: 'hit',    text: t => `モグラを${t}匹叩け`,        target: 5, limit: 8,  reward: 100,
      on: e => e.t === 'defeat' ? 1 : 0 },
    { id: 'trio',   text: () => `3兄弟モグラを全員倒せ`,      target: 1, limit: 12, reward: 150, force: 'trio',
      on: e => e.t === 'defeat' && e.kind === 'trio' ? 1 : 0 },
    { id: 'gold',   text: () => `金モグラを叩け`,            target: 1, limit: 10, reward: 150, force: 'gold',
      on: e => e.t === 'defeat' && e.kind === 'gold' ? 1 : 0 },
    { id: 'chain',  text: t => `ミスなしで${t}連続ヒット`,    target: 6, limit: 12, reward: 120,
      on: e => e.t === 'defeat' ? 1 : (e.t === 'escape' || e.t === 'bomb' || e.t === 'empty') ? 'reset' : 0 },
    { id: 'nobomb', text: t => `ボムに触らず${t}匹叩け`,      target: 7, limit: 12, reward: 120,
      on: e => e.t === 'defeat' ? 1 : e.t === 'bomb' ? 'fail' : 0 },
  ];

  // ================= 見た目（オリジナルSVG） =================
  const moleBody = (body, belly, face = 'normal') => `
      <ellipse cx="50" cy="62" rx="44" ry="50" fill="${body}"/>
      <ellipse cx="50" cy="80" rx="28" ry="26" fill="${belly}"/>
      ${face === 'angry'
        ? `<path d="M28 40 l13 5 M72 40 l-13 5" stroke="#222" stroke-width="3" stroke-linecap="round"/>`
        : ''}
      <circle cx="35" cy="47" r="5" fill="#222"/><circle cx="65" cy="47" r="5" fill="#222"/>
      <circle cx="37" cy="45" r="1.6" fill="#fff"/><circle cx="67" cy="45" r="1.6" fill="#fff"/>
      <ellipse cx="50" cy="60" rx="9" ry="6.5" fill="#f28aa0"/>
      <path d="M44 68 Q50 73 56 68" stroke="#222" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="24" cy="60" rx="6" ry="3.5" fill="#f6a5b4" opacity=".6"/>
      <ellipse cx="76" cy="60" rx="6" ry="3.5" fill="#f6a5b4" opacity=".6"/>`;
  const svg = inner => `<svg viewBox="0 0 100 110" width="100%" height="100%">${inner}</svg>`;

  // 3兄弟モグラ：叩くたびに1匹ずつ引っ込む（hp = 残っている匹数）
  //   赤ハチマキ＝長男（真ん中・最後まで残る）、青＝次男（左）、緑＝三男（右）
  const miniMole = (x, y, s, band, brows) => `
    <g transform="translate(${x} ${y}) scale(${s})">
      <circle cx="-15" cy="-21" r="6" fill="#7a4d31"/><circle cx="15" cy="-21" r="6" fill="#7a4d31"/>
      <circle cx="-15" cy="-21" r="3" fill="#e9a3a3"/><circle cx="15" cy="-21" r="3" fill="#e9a3a3"/>
      <ellipse cx="0" cy="2" rx="22" ry="28" fill="#8a5a3b"/>
      <ellipse cx="0" cy="14" rx="14" ry="13" fill="#c99a74"/>
      <path d="M-21.5 -11 Q0 -21 21.5 -11" stroke="${band}" stroke-width="6" fill="none"/>
      <path d="M20 -12 l8 -6 l-1 8 Z M20 -12 l9 2 l-6 5 Z" fill="${band}"/>
      ${brows ? '<path d="M-12 -7 l6 2 M12 -7 l-6 2" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>' : ''}
      <circle cx="-7.5" cy="-1" r="2.8" fill="#222"/><circle cx="7.5" cy="-1" r="2.8" fill="#222"/>
      <circle cx="-6.6" cy="-2" r="1" fill="#fff"/><circle cx="8.4" cy="-2" r="1" fill="#fff"/>
      <ellipse cx="0" cy="5.5" rx="4.5" ry="3.3" fill="#f28aa0"/>
      <path d="M-3.5 10 Q0 12.5 3.5 10" stroke="#222" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M-9 6 l-9 -1 M-9 8 l-9 2 M9 6 l9 -1 M9 8 l9 2" stroke="#5a3a26" stroke-width=".9" stroke-linecap="round"/>
      <ellipse cx="-14" cy="5" rx="3.5" ry="2" fill="#f6a5b4" opacity=".6"/>
      <ellipse cx="14" cy="5" rx="3.5" ry="2" fill="#f6a5b4" opacity=".6"/>
    </g>`;
  const trioSVG = hp => `<svg viewBox="0 0 124 110" width="100%" height="100%">
      ${hp >= 3 ? miniMole(24, 70, 0.95, '#3d7bff') : ''}
      ${hp >= 2 ? miniMole(100, 70, 0.95, '#2fb36b') : ''}
      ${miniMole(62, 58, 1.18, '#e5484d', hp === 1)}
    </svg>`;
  const bombSVG = svg(`
      <circle cx="50" cy="66" r="38" fill="#2a2a35"/>
      <circle cx="37" cy="52" r="9" fill="#fff" opacity=".18"/>
      <rect x="42" y="18" width="16" height="14" rx="3" fill="#555"/>
      <path d="M50 18 Q56 6 66 8" stroke="#a87b4f" stroke-width="3" fill="none"/>
      <circle cx="68" cy="8" r="6" fill="#ffcf3d"/><circle cx="68" cy="8" r="3" fill="#ff7a3d"/>
      <path d="M36 64 l8 6 M44 64 l-8 6 M56 64 l8 6 M64 64 l-8 6" stroke="#e5484d" stroke-width="3" stroke-linecap="round"/>`);
  const LOOKS = {
    normal: () => svg(moleBody('#8a5a3b', '#c99a74')),
    gold:   () => svg(moleBody('#f2b822', '#ffe48a')),
    trio:   hp => trioSVG(hp),
    bomb:   () => bombSVG,
  };

  // ================= DOM =================
  const $ = id => document.getElementById(id);
  const field = $('field');
  const holes = [];
  for (let i = 0; i < CONFIG.holes; i++) {
    const h = document.createElement('div');
    h.className = 'hole';
    h.innerHTML = `<div class="mole"></div><div class="front"></div>`;
    h.addEventListener('pointerdown', e => { e.preventDefault(); onTap(i); });
    field.appendChild(h);
    holes.push({ el: h, mole: h.querySelector('.mole'), type: null, hp: 0,
                 timer: null, hitTimer: null, active: false, busyUntil: 0 });
  }
  $('pips').innerHTML = '<span></span>'.repeat(CONFIG.rushNeed);
  $('rules').innerHTML = `
    🟤 モグラ：<b>+${CONFIG.points.normal}</b>　🟡 金モグラ：<b>+${CONFIG.points.gold}</b><br>
    👨‍👦‍👦 3兄弟モグラ：1匹ずつ <b>${CONFIG.points.trio.map(n => '+' + n).join('→')}</b>（全員で <b>+${CONFIG.points.trio.reduce((a, b) => a + b, 0)}</b>）<br>
    💣 ボム：叩くと <b>${CONFIG.points.bomb}</b>＆コンボ切れ<br>
    📋 画面上の<b>ミッション</b>を時間内にクリアでボーナス<br>
    🔥 ミッションを<b>${CONFIG.rushNeed}つ</b>クリアすると、残り${CONFIG.rushSeconds}秒で<b>ラストラッシュ</b>！（得点×${CONFIG.rush.scoreScale}）<br>
    🏅 スコアに応じて称号がもらえる`;

  // ================= サウンド・振動 =================
  let ac = null;
  const beep = (freq, dur = 0.08, type = 'square', vol = 0.12) => {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  };
  const jingle = (notes, step = 0.09) => notes.forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.1), i * step * 1000));
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} };

  // ================= ベストスコア =================
  const loadBest = () => { try { return +localStorage.getItem('mogura-best') || 0; } catch (_) { return 0; } };
  const saveBest = v => { try { localStorage.setItem('mogura-best', v); } catch (_) {} };
  let best = loadBest(); $('best').textContent = best;

  // ================= ゲーム状態 =================
  let state, rafId, spawnTimer;
  const lerp = ([a, b], t) => a + (b - a) * t;
  const now = () => performance.now();
  const elapsed = () => (now() - state.start) / 1000;
  const remaining = () => Math.max(0, CONFIG.duration - elapsed());

  function reset() {
    state = { running: false, score: 0, start: 0, combo: 0, maxCombo: 0, hits: 0, taps: 0, goodTaps: 0, bombs: 0,
              mission: null, nextMissionAt: CONFIG.missionFirstDelay, lastMissionId: null,
              cleared: 0, missionsOver: false, rush: false, forceType: null };
    holes.forEach(hideNow);
    document.body.classList.remove('rush');
    setMissionIdle('まもなく開始…');
    updateHud();
  }

  function updateHud() {
    const remain = state.running ? remaining() : CONFIG.duration;
    $('score').textContent = state.score;
    $('time').textContent = Math.ceil(remain);
    const bar = $('bar');
    bar.style.width = (remain / CONFIG.duration * 100) + '%';
    bar.classList.toggle('hurry', remain <= CONFIG.rushSeconds);
    $('combo').textContent = state.combo >= 3 ? `${state.combo}コンボ!` : '';
    [...$('pips').children].forEach((p, i) => p.classList.toggle('on', i < state.cleared));
    $('rushText').textContent = state.rush ? '🔥 ラストラッシュ中！'
      : state.cleared >= CONFIG.rushNeed ? '🔥 ラッシュ解放！'
      : `ラッシュまで あと${CONFIG.rushNeed - state.cleared}`;
    // ミッションの残り時間バー
    const m = state.mission;
    if (m) $('mBar').style.width = Math.max(0, 1 - (elapsed() - m.start) / m.def.limit) * 100 + '%';
  }

  // ================= 出現 =================
  function params() {
    const t = Math.min(1, elapsed() / CONFIG.duration);
    if (state.rush) {
      const r = CONFIG.rush;
      return { interval: r.spawnInterval, up: r.upTime, max: r.maxActive, rates: r.rates };
    }
    return { interval: lerp(CONFIG.spawnInterval, t), up: lerp(CONFIG.upTime, t),
             max: Math.round(lerp(CONFIG.maxActive, t)), rates: CONFIG.rates };
  }

  function pickType(rates) {
    if (state.forceType) { const f = state.forceType; state.forceType = null; return f; }
    const r = Math.random();
    if (r < rates.gold) return 'gold';
    if (r < rates.gold + rates.bomb) return 'bomb';
    if (r < rates.gold + rates.bomb + rates.trio) return 'trio';
    return 'normal';
  }

  function spawn() {
    if (!state.running) return;
    const p = params();
    if (holes.filter(h => h.active).length < p.max) {
      const t = now();
      const free = holes.filter(h => !h.active && t >= h.busyUntil);
      if (free.length) {
        const h = free[Math.floor(Math.random() * free.length)];
        const type = pickType(p.rates);
        const up = p.up * (type === 'gold' ? 0.6 : type === 'trio' ? CONFIG.trioUpTimeScale : 1);
        show(h, type, up);
      }
    }
    spawnTimer = setTimeout(spawn, p.interval * (0.7 + Math.random() * 0.6));
  }

  function show(h, type, upTime) {
    clearTimeout(h.hitTimer);
    h.type = type; h.active = true; h.hp = type === 'trio' ? CONFIG.trioHp : 1;
    h.mole.innerHTML = LOOKS[type](h.hp);
    h.mole.classList.toggle('wide', type === 'trio');
    h.el.classList.remove('hit', 'bonk');
    void h.el.offsetWidth;
    h.el.classList.add('up');
    h.timer = setTimeout(() => {
      if (h.active && h.type !== 'bomb') { state.combo = 0; missionEvent({ t: 'escape', kind: h.type }); }
      hide(h);
    }, upTime);
  }
  function hide(h) {
    clearTimeout(h.timer); h.active = false;
    h.busyUntil = now() + 300;
    h.el.classList.remove('up');
  }
  function hideNow(h) { hide(h); clearTimeout(h.hitTimer); h.el.classList.remove('hit', 'bonk'); h.type = null; h.busyUntil = 0; }

  // ================= タップ =================
  const scale = pts => state.rush && pts > 0 ? Math.round(pts * CONFIG.rush.scoreScale) : pts;

  function onTap(i) {
    if (!state || !state.running) return;
    const h = holes[i];
    state.taps++;
    if (!h.active) { missionEvent({ t: 'empty' }); return; }

    // 3兄弟：まだ残っている兄弟がいる
    if (h.type === 'trio' && h.hp > 1) {
      const p = scale(CONFIG.points.trio[CONFIG.trioHp - h.hp]);   // 1回目10点、2回目20点
      h.hp--; state.goodTaps++;
      addScore(p);
      h.mole.innerHTML = LOOKS.trio(h.hp);
      h.el.classList.remove('bonk'); void h.el.offsetWidth; h.el.classList.add('bonk');
      popText(h.el, `+${p}` + (h.hp === 1 ? ' あと1匹!' : ''), '#8a5a3b', true);
      beep(900 + (CONFIG.trioHp - h.hp) * 220, 0.06, 'triangle', 0.15); buzz(10);
      return;
    }

    let pts, color;
    if (h.type === 'bomb') {
      pts = CONFIG.points.bomb; state.combo = 0; state.bombs++;
      color = 'var(--red)'; beep(90, 0.25, 'sawtooth', 0.2); buzz(120);
      missionEvent({ t: 'bomb' });
    } else {
      state.combo++; state.hits++; state.goodTaps++;
      state.maxCombo = Math.max(state.maxCombo, state.combo);
      const mult = Math.min(CONFIG.comboMaxMult, 1 + Math.floor(state.combo / CONFIG.comboStep));
      pts = h.type === 'trio' ? scale(CONFIG.points.trio[CONFIG.trioHp - 1])   // 3回目（30点）
                              : scale(CONFIG.points[h.type] * mult);
      color = h.type === 'gold' ? '#d99a00' : h.type === 'trio' ? '#c0392b' : 'var(--accent)';
      beep(h.type === 'gold' ? 1320 : h.type === 'trio' ? 1560 : 660 + Math.min(state.combo, 20) * 20, 0.09); buzz(15);
      missionEvent({ t: 'defeat', kind: h.type });
    }
    addScore(pts);
    popText(h.el, (pts > 0 ? '+' : '') + pts, color);
    clearTimeout(h.timer); h.active = false;
    h.busyUntil = now() + 500;
    h.el.classList.add('hit');
    h.hitTimer = setTimeout(() => h.el.classList.remove('up', 'hit'), 180);
  }

  function addScore(pts) { state.score = Math.max(0, state.score + pts); }

  function popText(el, txt, color, small) {
    const p = document.createElement('div');
    p.className = 'pop' + (small ? ' small' : ''); p.textContent = txt; p.style.color = color;
    el.appendChild(p);
    setTimeout(() => p.remove(), 600);
  }

  function banner(html) {
    const b = document.createElement('div');
    b.className = 'banner'; b.innerHTML = html;
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1300);
  }

  // ================= ミッション =================
  function setMissionIdle(text) {
    const el = $('mission');
    el.classList.add('idle');
    $('mText').textContent = text; $('mProg').textContent = ''; $('mBar').style.width = '0';
  }

  function startMission() {
    const pool = MISSIONS.filter(m => m.id !== state.lastMissionId);
    const def = pool[Math.floor(Math.random() * pool.length)];
    state.mission = { def, start: elapsed(), p: 0 };
    state.lastMissionId = def.id;
    if (def.force) state.forceType = def.force;
    const el = $('mission');
    el.classList.remove('idle', 'clear', 'fail');
    $('mText').textContent = def.text(def.target) + `（+${def.reward}）`;
    $('mProg').textContent = `0/${def.target}`;
    beep(990, 0.06, 'triangle'); setTimeout(() => beep(1320, 0.08, 'triangle'), 70);
  }

  function missionEvent(e) {
    const m = state.mission;
    if (!m) return;
    const r = m.def.on(e, m);
    if (r === 'fail') return endMission(false);
    if (r === 'reset') m.p = 0; else m.p += r;
    $('mProg').textContent = `${Math.min(m.p, m.def.target)}/${m.def.target}`;
    if (m.p >= m.def.target) endMission(true);
  }

  function endMission(success, quiet) {
    const m = state.mission; if (!m) return;
    state.mission = null;
    state.nextMissionAt = elapsed() + CONFIG.missionGap;
    const el = $('mission');
    el.classList.remove('clear', 'fail'); void el.offsetWidth;
    if (success) {
      state.cleared++;
      addScore(m.def.reward);
      el.classList.add('clear');
      setMissionIdle(`クリア！ +${m.def.reward}`);
      banner(`MISSION CLEAR!<small>+${m.def.reward}点</small>`);
      jingle([784, 988, 1175, 1568]); buzz([20, 40, 20]);
      if (state.cleared === CONFIG.rushNeed) setTimeout(() => banner(`🔥 ラッシュ解放！<small>残り${CONFIG.rushSeconds}秒で発動</small>`), 1100);
    } else {
      el.classList.add('fail');
      setMissionIdle(quiet ? 'ミッション終了' : '失敗…');
      if (!quiet) beep(200, 0.2, 'triangle');
    }
  }

  function tickMission() {
    if (state.missionsOver) return;
    // 残り rushSeconds 秒でミッションは終了 → ラッシュ判定
    if (remaining() <= CONFIG.rushSeconds) {
      state.missionsOver = true;
      if (state.mission) endMission(false, true);
      state.forceType = null;
      if (state.cleared >= CONFIG.rushNeed) startRush();
      else { setMissionIdle('ミッション終了'); banner(`ラストスパート！<small>ラッシュは不発…</small>`); }
      return;
    }
    const m = state.mission;
    if (m && elapsed() - m.start >= m.def.limit) endMission(false);
    else if (!m && elapsed() >= state.nextMissionAt) startMission();
  }

  function startRush() {
    state.rush = true;
    document.body.classList.add('rush');
    setMissionIdle(`ラストラッシュ！ 得点×${CONFIG.rush.scoreScale}`);
    banner(`🔥 LAST RUSH! 🔥<small>得点×${CONFIG.rush.scoreScale}</small>`);
    jingle([523, 659, 784, 1047, 1319], 0.07); buzz([40, 30, 40]);
    clearTimeout(spawnTimer); spawn();
  }

  // ================= 進行 =================
  function loop() {
    tickMission();
    updateHud();
    if (remaining() <= 0) return end();
    rafId = requestAnimationFrame(loop);
  }

  function countdown() {
    const scr = $('countScreen'), num = $('countNum');
    let n = 3; scr.hidden = false; num.textContent = n; beep(440, 0.1);
    const iv = setInterval(() => {
      n--;
      if (n > 0) { num.textContent = n; beep(440, 0.1); }
      else { clearInterval(iv); scr.hidden = true; beep(880, 0.2); begin(); }
    }, 700);
  }

  function begin() {
    state.running = true; state.start = now();
    spawn(); loop();
  }

  function rankFor(score) {
    let idx = 0;
    CONFIG.ranks.forEach((r, i) => { if (score >= r.score) idx = i; });
    return { cur: CONFIG.ranks[idx], next: CONFIG.ranks[idx + 1] };
  }

  function end() {
    state.running = false;
    clearTimeout(spawnTimer); cancelAnimationFrame(rafId);
    holes.forEach(hideNow);
    document.body.classList.remove('rush');
    setMissionIdle('おつかれさま！');
    updateHud();
    beep(523, 0.15); setTimeout(() => beep(392, 0.3), 160);
    const isNew = state.score > best;
    if (isNew) { best = state.score; saveBest(best); $('best').textContent = best; }
    $('resTitle').textContent = isNew ? '自己ベスト更新！' : 'タイムアップ！';
    const { cur, next } = rankFor(state.score);
    $('resScore').textContent = state.score;
    $('resRank').textContent = '🏅 ' + cur.name;
    $('resNext').textContent = next ? `次の「${next.name}」まで あと${next.score - state.score}点` : '最高ランク達成！';
    $('resHit').textContent = state.hits;
    $('resAcc').textContent = state.taps ? Math.round(state.goodTaps / state.taps * 100) + '%' : '0%';
    $('resCombo').textContent = state.maxCombo;
    $('resMission').textContent = state.cleared;
    $('resRush').textContent = state.rush ? '発動' : '-';
    $('resBomb').textContent = state.bombs;
    renderRanking();
    sync();   // 新しい自己ベストの送信
    setTimeout(() => $('resultScreen').hidden = false, 400);
  }

  function startGame() {
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (_) { ac = null; }
    $('startScreen').hidden = true; $('resultScreen').hidden = true;
    reset(); countdown();
  }

  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);

  // ================= 全体ランキングとオフライン同期 =================
  //   接続情報は config.js から読む（空ならランキング無効、自己ベストのみ記録）
  //   ・このゲーム専用の window.MOGURA_CONFIG があればそれを使い、なければシリーズ共通の window.MARUO_CONFIG を使う
  //   ・キーの項目名は SUPABASE_ANON_KEY と SUPABASE_KEY のどちらでもよい
  const RK_CFG = window.MOGURA_CONFIG || window.MARUO_CONFIG || {};
  const RK = {
    url: String(RK_CFG.SUPABASE_URL || '').trim().replace(/\/+$/, ''),
    key: String(RK_CFG.SUPABASE_ANON_KEY || RK_CFG.SUPABASE_KEY || '').trim(),
    fetchLimit: 50,      // 取得件数
    showLimit: 20,       // 表示件数
    timeout: 8000,       // 通信のタイムアウト（ms）
    retryEvery: 60000,   // 未送信がある間の再送間隔（ms）
  };
  const rankingOn = !!(RK.url && RK.key);

  // --- 端末に保存するデータ（すべて try/catch） ---
  const ls = {
    get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, String(v)); } catch (_) {} },
  };
  const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
  const newUuid = () => {
    if (crypto.randomUUID) { try { return crypto.randomUUID(); } catch (_) {} }
    const h = hex(16).split('');
    h[12] = '4'; h[16] = '89ab'[parseInt(h[16], 16) & 3];
    const x = h.join('');
    return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
  };

  // 書き込み用の秘密ID（端末の外へは送信時にしか出さない）と、表示用の公開ID
  let playerId = ls.get('mogura-player-id');
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(playerId || '')) { playerId = newUuid(); ls.set('mogura-player-id', playerId); }
  let pubId = ls.get('mogura-pub-id');
  if (!/^[0-9a-f]{12}$/.test(pubId || '')) { pubId = hex(6); ls.set('mogura-pub-id', pubId); }

  let nickname = ls.get('mogura-name');
  if (!nickname) { nickname = 'モグラ' + (1000 + Math.floor(Math.random() * 9000)); ls.set('mogura-name', nickname); }
  let nameDirty = ls.get('mogura-name-dirty') === '1';
  let syncedBest = parseInt(ls.get('mogura-synced-best'), 10) || 0;
  let boardCache = null;   // { rows:[{pub_id,name,best,updated_at}], rank, at }
  try { boardCache = JSON.parse(ls.get('mogura-board-cache') || 'null'); } catch (_) {}
  if (!boardCache || !Array.isArray(boardCache.rows)) boardCache = null;

  let net = 'idle';        // idle / syncing / ok / offline
  let syncing = false, syncAgain = false;

  // 未送信：自己ベストが0より大きく、「自己ベスト > 最後に送れた値」または「名前の変更が未送信」
  const hasUnsent = () => best > 0 && (best > syncedBest || nameDirty);

  // --- 通信 ---
  async function rpc(fn, args) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), RK.timeout);
    const headers = { 'Content-Type': 'application/json', apikey: RK.key };
    if (RK.key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + RK.key;   // 旧形式の anon key
    try {
      const res = await fetch(`${RK.url}/rest/v1/rpc/${fn}`, {
        method: 'POST', headers, body: JSON.stringify(args), cache: 'no-store', signal: ctrl.signal,
      });
      const text = await res.text();
      const body = text ? JSON.parse(text) : null;
      if (!res.ok) throw new Error((body && body.message) || `HTTP ${res.status}`);
      return body;
    } finally { clearTimeout(timer); }
  }

  // --- 同期（同時に2つは走らせない。走行中に呼ばれたら終了後にもう1回） ---
  async function sync() {
    if (!rankingOn) return renderRanking();
    if (syncing) { syncAgain = true; return; }
    if (navigator.onLine === false) { net = 'offline'; return renderRanking(); }
    syncing = true; net = 'syncing'; renderRanking();
    try {
      if (hasUnsent()) {
        const sentBest = best, sentName = nickname;
        await rpc('mogura_submit_score', { p_player_id: playerId, p_pub_id: pubId, p_name: sentName, p_best: sentBest });
        syncedBest = Math.max(syncedBest, sentBest); ls.set('mogura-synced-best', syncedBest);
        if (sentName === nickname) { nameDirty = false; ls.set('mogura-name-dirty', '0'); }
      }
      const [rows, rank] = await Promise.all([
        rpc('mogura_get_leaderboard', { p_limit: RK.fetchLimit }),
        best > 0 ? rpc('mogura_get_rank', { p_best: best }) : Promise.resolve(null),
      ]);
      boardCache = { rows: Array.isArray(rows) ? rows : [], rank: typeof rank === 'number' ? rank : null, rankFor: best, at: Date.now() };
      ls.set('mogura-board-cache', JSON.stringify(boardCache));
      net = 'ok';
    } catch (e) {
      net = 'offline';            // 未送信の記録は消さない
      console.warn('ランキング同期に失敗:', e && e.message);
    } finally {
      syncing = false;
      renderRanking();
      if (syncAgain) { syncAgain = false; sync(); }
    }
  }

  // --- 表示用の並び：未送信の自己ベストを保存済みランキングに重ねて並べ直す ---
  function boardView() {
    if (!boardCache) return null;
    const rows = boardCache.rows.filter(r => r.pub_id !== pubId).map(r => ({ ...r }));
    const serverMine = boardCache.rows.find(r => r.pub_id === pubId);
    const fullList = boardCache.rows.length < RK.fetchLimit;   // 全員が取得できているか
    let myRank = null, myRow = null;
    if (best > 0 || serverMine) {
      const myBest = Math.max(best, serverMine ? serverMine.best : 0);
      myRow = { pub_id: pubId, name: nickname, best: myBest, me: true, unsent: hasUnsent() };
      // 同点は先に記録した人が上：未送信は一番新しいので同点の後ろ。送信済みならサーバーの位置を保つ
      let idx = rows.findIndex(r => r.best < myBest ||
        (serverMine && !myRow.unsent && r.best === myBest && r.updated_at > serverMine.updated_at));
      if (idx < 0) idx = rows.length;
      if (idx < rows.length || fullList || serverMine) {
        rows.splice(idx, 0, myRow); myRank = idx + 1;
      } else if (!myRow.unsent && boardCache.rank && boardCache.rankFor === best) {
        myRank = boardCache.rank;   // 上位50件にいないときは、サーバーの順位（未送信がないときだけ）
      }
    }
    return { rows, myRank, myRow };
  }

  const fmtTime = t => {
    const d = new Date(t);
    return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
  };

  function netText() {
    if (!rankingOn) return 'ランキングサーバーが未設定です（自己ベストのみ記録されます）';
    let t;
    if (net === 'syncing') t = 'ランキングを更新中…';
    else if (net === 'offline') t = boardCache ? `オフライン中：${fmtTime(boardCache.at)} 時点のランキングを表示`
                                               : 'オフライン中：オンラインになるとランキングが表示されます';
    else t = boardCache ? `${fmtTime(boardCache.at)} に更新` : 'ランキングを更新中…';
    if (hasUnsent()) t += ` ／ 自己ベスト ${best} は未送信です。オンラインになると自動で送信されます`;
    return t;
  }

  function cell(tr, cls, text) { const td = document.createElement('td'); td.className = cls; td.textContent = text; tr.appendChild(td); }
  function rowEl(r, pos) {
    const tr = document.createElement('tr');
    if (r.me) tr.className = 'me';
    cell(tr, 'pos', pos == null ? '–' : String(pos));
    cell(tr, 'nm', r.name + (r.me ? (r.unsent ? '（あなた・未送信）' : '（あなた）') : ''));   // 名前は必ず文字として表示
    cell(tr, 'sc', String(r.best));
    return tr;
  }

  // 結果画面とランキング画面の「自己ベスト・全体順位・状況」を最新にする
  function renderRanking() {
    const view = rankingOn ? boardView() : null;
    const rank = view && view.myRank;
    for (const [b, w, wrap, n] of [['resBest', 'resWorld', 'resWorldWrap', 'resNet'], ['rkBest', 'rkWorld', 'rkWorldWrap', 'rkNet']]) {
      $(b).textContent = best;
      $(wrap).hidden = !rank;
      if (rank) $(w).textContent = rank;
      $(n).textContent = netText();
    }
    if ($('rankScreen').hidden) return;
    if (document.activeElement !== $('nameInput')) $('nameInput').value = nickname;
    const body = $('rkBody'); body.innerHTML = '';
    if (!rankingOn) return;
    if (!view) return;   // 取得歴なし：状況説明だけ
    if (!view.rows.length) { const d = document.createElement('div'); d.className = 'rk-empty'; d.textContent = 'まだ記録がありません'; body.appendChild(d); return; }
    const table = document.createElement('table'); table.className = 'rk-table';
    const tb = document.createElement('tbody');
    view.rows.slice(0, RK.showLimit).forEach((r, i) => tb.appendChild(rowEl(r, i + 1)));
    const shown = view.rows.slice(0, RK.showLimit).some(r => r.me);
    if (view.myRow && !shown) {
      const gap = document.createElement('tr'); gap.className = 'gap';
      const td = document.createElement('td'); td.colSpan = 3; td.textContent = '⋯'; gap.appendChild(td); tb.appendChild(gap);
      tb.appendChild(rowEl(view.myRow, view.myRank));
    }
    table.appendChild(tb); body.appendChild(table);
  }

  // --- ランキング画面：タイトル／結果のカードと切り替える ---
  let rankFrom = null;
  function openRanking(fromId) {
    rankFrom = fromId;
    $(fromId).hidden = true;
    $('rankScreen').hidden = false;
    renderRanking();
    sync();   // 最新の順位を取得
  }
  function closeRanking() {
    $('nameInput').blur();
    $('rankScreen').hidden = true;
    if (rankFrom) $(rankFrom).hidden = false;
  }
  $('rankBtn1').addEventListener('click', () => openRanking('startScreen'));
  $('rankBtn2').addEventListener('click', () => openRanking('resultScreen'));
  $('rankClose').addEventListener('click', closeRanking);

  // --- ニックネーム：制御文字と < > を除き、前後の空白を削る。空なら元に戻す ---
  function commitName() {
    const input = $('nameInput');
    const cleaned = Array.from(input.value.replace(/[\u0000-\u001f\u007f<>]/g, '').trim()).slice(0, 12).join('');
    if (!cleaned) { input.value = nickname; return; }
    input.value = cleaned;
    if (cleaned === nickname) return;
    nickname = cleaned; ls.set('mogura-name', nickname);
    nameDirty = true; ls.set('mogura-name-dirty', '1');
    renderRanking();
    sync();   // 名前の送信
  }
  $('nameInput').addEventListener('blur', commitName);
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('nameInput').blur(); } });

  // --- 同期するタイミング ---
  setTimeout(sync, 1500);                                                         // 起動の1.5秒後
  window.addEventListener('online', sync);                                        // ネットに戻ったとき
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });  // 前面に戻ったとき
  setInterval(() => { if (rankingOn && hasUnsent()) sync(); }, RK.retryEvery);   // 未送信がある間、60秒ごと
  renderRanking();

  document.addEventListener('gesturestart', e => e.preventDefault());
  reset();
})();
</script>
</body>
</html>
